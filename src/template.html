<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <form id="weather-form">
            <label for="weather">Insert location for weather data</label>
            <input type="text" name="weather" id="weather">
            <button id="submit-location-weather" type="submit">Submit</button>
        </form>
        <div id="loading-spinner" style="display: none;">
            <p>Loading</p>
        </div>
        <div class="display-content" style="display: none;">
            <h2 id="weather-location"></h2>
            <p id="weather-temp"></p>
            <p id="weather-desc"></p>
            <button id="toggle-unit" type="button"></button>
        </div>
    </main>
</body>

</html>
